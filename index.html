
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulando2D Pro - TikTok Space Royale</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Inter:wght@400;900&display=swap" rel="stylesheet">
    <script>
      // Shim global para o objeto process, fundamental para evitar ReferenceErrors em navegadores
      window.process = {
        env: {
          API_KEY: ""
        }
      };
    </script>
    <style>
      body { 
        font-family: 'Inter', sans-serif; 
        background: #000000; 
        color: #e2e8f0; 
        overflow: hidden; 
      }
      .font-bungee { font-family: 'Bungee', cursive; }
      
      .space-bg {
        background-color: #000000;
        background-image: 
          radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 40px),
          radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 30px),
          radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 40px);
        background-size: 550px 550px, 350px 350px, 250px 250px;
        background-position: 0 0, 40px 60px, 130px 270px;
        animation: spaceShift 100s linear infinite;
      }

      @keyframes spaceShift {
        from { background-position: 0 0, 40px 60px, 130px 270px; }
        to { background-position: 550px 550px, 390px 410px, 380px 520px; }
      }

      .canvas-container {
        box-shadow: 0 0 80px rgba(0,242,234,0.1), 0 0 30px rgba(255,0,80,0.1);
        border: 4px solid #0f0f12;
        background: #000;
      }
      
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #ff0050; }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        background: #00f2ea;
        cursor: pointer;
        border-radius: 50%;
        box-shadow: 0 0 10px #00f2ea;
      }
    </style>
    <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@0.460.0",
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
  </head>
  <body class="space-bg">
    <div id="root"></div>
    <!-- Importação relativa para melhor compatibilidade com Vercel -->
    <script type="module" src="index.tsx"></script>
  </body>
</html>
